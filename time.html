<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>タイムマネジメント</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003b46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タイムマネジメント">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#eef5f7; --bg2:#e2eef1; --panel:#ffffff; --panel2:#f4f9fa; --grid:#c9dfe5;
    --txt:#123a41; --dim:#57828b; --dimmer:#8aabb2;
    --accent:#07575b; --green:#4c9a6e; --pop:#aebd38; --pop2:#c8d654; --popd:#7f8f18; --warn:#c2543c;
    --steel:#68829e; --ink:#ffffff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0 auto;background:var(--bg);color:var(--txt);font-family:var(--sans);max-width:600px;padding:0 12px 130px;}
  button{font-family:var(--mono);cursor:pointer;}

  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
      margin:0 -12px 12px;padding:14px 16px 12px;
      background:linear-gradient(135deg,#021c1e 0%,#003b46 45%,#07575b 80%,#2c7873 100%);
      border-bottom:1px solid var(--grid);}
  h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.03em;color:#eaf5f6;}
  h1 .hd-bar{display:inline-block;width:22px;height:4px;border-radius:2px;background:var(--pop);margin-right:8px;vertical-align:2px;}
  .sub{font-family:var(--mono);font-size:11px;color:#9fc6cb;margin-top:3px;}

  .tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--panel);border:1px solid var(--grid);border-radius:11px;padding:4px;}
  .tabs>button{flex:1;font-size:13px;padding:9px 0;border:none;background:transparent;color:var(--dim);border-radius:8px;font-weight:600;}
  .tabs>button.on{background:var(--accent);color:var(--ink);font-weight:700;}

  .navbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .navbar button{background:var(--panel);border:1px solid var(--grid);color:var(--txt);border-radius:8px;padding:5px 12px;font-size:13px;}
  .navbar .rng{font-family:var(--mono);font-size:12px;color:var(--dim);flex:1;text-align:center;}

  .days,.dayrow{display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-bottom:12px;}
  .days button,.dayrow button{flex:1 0 auto;min-width:44px;padding:7px 0;border:1px solid var(--grid);background:var(--panel);color:var(--dim);border-radius:9px;font-size:10px;line-height:1.4;text-align:center;}
  .days button b,.dayrow button b{display:block;font-size:14px;color:var(--txt);}
  .days button.on{border-color:var(--pop);background:#f8fae9;box-shadow:0 0 0 1px var(--pop);}
  .days button.on b{color:var(--accent);}
  .days button.today:not(.on){border-color:var(--accent);}
  .dayrow button.on{border-color:var(--txt);background:var(--panel2);}

  .palette{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
  .chip{font-size:12px;padding:6px 10px;border-radius:15px;border:1px solid var(--grid);background:var(--panel);color:var(--dim);display:flex;align-items:center;gap:6px;}
  .chip .dot{width:9px;height:9px;border-radius:50%;}
  .chip.armed{color:var(--txt);font-weight:700;}

  .toolbar{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
  .toolbar .mode{display:flex;gap:4px;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:3px;}
  .toolbar .mode button{font-size:12px;padding:6px 10px;border:none;background:transparent;color:var(--dim);border-radius:6px;}
  .toolbar .mode button.on{background:var(--accent);color:var(--ink);font-weight:700;}
  .toolbar .mode button.on.range{background:var(--green);}
  .toolbar .mode button.on.memo{background:var(--pop);color:#2c3305;}
  .toolbar .mode button.on.copy{background:var(--steel);}
  .toolbar .act{margin-left:auto;display:flex;gap:6px;}
  .toolbar .act button{font-size:11px;padding:6px 10px;border:1px solid var(--grid);background:var(--panel);color:var(--txt);border-radius:7px;}
  .hint{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:8px;min-height:15px;}
  .hint b{color:var(--popd);}
  .hint .hbtn{font-size:11px;padding:3px 9px;margin-left:6px;border:1px solid var(--grid);background:var(--panel);color:var(--txt);border-radius:6px;vertical-align:1px;}
  .row.csrc{outline:2px dashed var(--steel);outline-offset:-2px;}

  .grid{border:1px solid var(--grid);border-radius:11px;overflow:hidden;background:var(--panel);}
  .row{display:flex;align-items:stretch;border-bottom:1px solid rgba(201,223,229,.7);min-height:29px;}
  .row:last-child{border-bottom:none;}
  .row.hh{border-top:1px solid var(--grid);}
  .row .t{flex:0 0 50px;font-family:var(--mono);font-size:10.5px;color:var(--dimmer);display:flex;align-items:center;padding-left:8px;border-right:1px solid var(--grid);}
  .row.hh .t{color:var(--dim);}
  .row.now .t{color:var(--popd);font-weight:700;}
  .row .bar{flex:0 0 4px;background:transparent;}
  .row .cell{flex:1;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:7px;overflow:hidden;}
  .row .cell .lab{font-weight:700;white-space:nowrap;}
  .row .cell .nt{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .cell .out{color:var(--popd);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row:active{background:#e6f1f3;}
  .row.rsel{outline:2px solid var(--pop);outline-offset:-2px;animation:rpulse 1s infinite;}
  @keyframes rpulse{50%{outline-color:rgba(174,189,56,.25);}}

  /* ---- 生産物バー（常設・画面下） ---- */
  .prodbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));
    width:calc(100% - 24px);max-width:576px;display:flex;align-items:center;gap:9px;
    background:linear-gradient(135deg,#07575b,#003b46);border:1.5px solid var(--pop);border-radius:14px;
    padding:12px 14px;z-index:15;box-shadow:0 6px 22px rgba(7,60,66,.35);cursor:pointer;}
  .prodbar .pb-ic{color:var(--pop2);font-weight:800;font-size:16px;font-family:var(--mono);}
  .prodbar .pb-t{font-size:13px;font-weight:700;color:#eaf5f6;}
  .prodbar .pb-n{font-family:var(--mono);background:var(--pop);color:#1c2405;font-weight:800;border-radius:10px;padding:2px 9px;font-size:13px;}
  .prodbar .pb-add{margin-left:auto;font-size:12px;color:var(--pop2);font-weight:700;font-family:var(--mono);}
  .prodbar.zero{animation:pglow 2.2s infinite;}
  .prodbar.zero .pb-n{background:var(--warn);color:#fff;}
  @keyframes pglow{50%{box-shadow:0 0 16px rgba(174,189,56,.55);}}

  /* ---- 入力シート（画面下から出る。スクロール不要） ---- */
  .sheetbk{position:fixed;inset:0;background:rgba(6,42,47,.35);z-index:19;display:none;}
  .sheetbk.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;
    background:var(--panel);border:1px solid var(--grid);border-bottom:none;border-radius:18px 18px 0 0;
    box-shadow:0 -8px 30px rgba(7,60,66,.18);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:20;
    transform:translateY(110%);transition:transform .18s ease-out;}
  .sheet.open{transform:none;}
  .sheet .sh-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .sheet .sh-time{font-family:var(--mono);font-weight:700;font-size:15px;}
  .sheet .sh-cat{font-size:12px;font-weight:700;padding:3px 10px;border-radius:11px;color:var(--ink);}
  .sheet .sh-x{margin-left:auto;background:var(--panel);border:1px solid var(--grid);color:var(--dim);border-radius:8px;padding:4px 11px;font-size:13px;}
  .sheet input{width:100%;background:var(--bg2);border:1px solid var(--grid);color:var(--txt);font-size:16px;padding:11px;border-radius:10px;font-family:var(--sans);}
  .sheet .outwrap{margin-top:9px;border:1.5px solid var(--pop);border-radius:12px;padding:9px 12px 10px;background:rgba(174,189,56,.13);}
  .sheet .outwrap label{font-size:11px;font-weight:800;color:var(--popd);letter-spacing:.06em;display:block;margin-bottom:4px;font-family:var(--mono);}
  .sheet .outwrap input{border:none;background:transparent;padding:3px 0;border-radius:0;}
  .sheet .outwrap input:focus{outline:none;}
  .sheet .sh-done{margin-top:11px;width:100%;padding:12px;background:var(--accent);color:var(--ink);font-weight:800;border:none;border-radius:10px;font-size:14px;}

  /* ---- 分析 ---- */
  .piewrap{display:flex;align-items:center;gap:16px;margin:6px 0 4px;}
  svg{flex:0 0 auto;}
  .legend{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
  .lrow{display:grid;grid-template-columns:12px 1fr auto;gap:7px;align-items:center;font-size:12px;}
  .lrow i{width:10px;height:10px;border-radius:3px;}
  .lrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow .v{font-family:var(--mono);font-size:11px;color:var(--dim);}
  h2{font-size:11px;font-family:var(--mono);letter-spacing:.07em;color:var(--dim);margin:20px 0 10px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--grid);padding-bottom:6px;}
  h2 .h2b{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pop);margin-right:7px;vertical-align:-1px;}
  .scope{display:flex;gap:4px;margin-bottom:8px;background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:4px;}
  .scope button{flex:1;font-size:12px;padding:8px 0;border:none;background:transparent;color:var(--dim);border-radius:7px;}
  .scope button.on{background:var(--accent);color:var(--ink);font-weight:700;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .card{background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:10px 11px;}
  .card .cv{font-family:var(--mono);font-size:18px;font-weight:600;line-height:1;}
  .card .cl{font-size:10px;color:var(--dim);margin-top:6px;}
  .day{margin-bottom:10px;}
  .day .dh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:4px;}
  .stack{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--bg2);}
  .seg{height:100%;}.seg:not(:last-child){border-right:1px solid var(--bg);}
  .det .drow{display:grid;grid-template-columns:44px 4px 1fr;gap:8px;border-bottom:1px solid rgba(201,223,229,.7);padding:5px 0;}
  .det .dt{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);align-self:center;}
  .det .db{border-radius:2px;}
  .det .dc{display:flex;flex-direction:column;gap:1px;justify-content:center;}
  .det .dcat{font-size:11px;font-weight:600;}
  .det .dtxt{font-size:12px;color:var(--txt);}
  .det .dout{font-size:12px;color:var(--popd);font-weight:600;}
  .prodcard{border:1px solid var(--grid);border-left:4px solid var(--pop);border-radius:9px;background:var(--panel);padding:8px 11px;margin-bottom:7px;display:flex;gap:9px;align-items:baseline;}
  .prodcard .pm{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);flex:0 0 auto;}
  .prodcard .po{font-size:13px;color:var(--popd);font-weight:600;}
  .note{font-size:11px;color:var(--dimmer);font-family:var(--mono);margin-top:10px;line-height:1.5;}
  .saved{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--pop);color:#1c2405;font-family:var(--mono);font-size:11px;padding:6px 14px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;font-weight:700;z-index:22;white-space:nowrap;}
  .saved.show{opacity:1;}
  .io{border:1px solid var(--grid);border-radius:10px;background:var(--panel);margin-top:12px;}
  .io summary{padding:10px 12px;font-size:12px;font-family:var(--mono);color:var(--dim);cursor:pointer;list-style:none;}
  .io summary::-webkit-details-marker{display:none;}
  .io textarea{width:100%;min-height:120px;background:var(--bg);color:var(--txt);border:none;border-top:1px solid var(--grid);font-family:var(--mono);font-size:11px;padding:10px;resize:vertical;}
  .io .iobtn{padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;}
  .io .iobtn button{font-size:11px;padding:6px 12px;border:1px solid var(--grid);background:var(--panel2);color:var(--txt);border-radius:7px;}
</style>
</head>
<body>
  <div class="hd">
    <div>
      <h1><span class="hd-bar"></span>タイムマネジメント</h1>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <div class="tabs">
    <button id="tabRec" class="on" onclick="setTab('rec')">記録</button>
    <button id="tabAna" onclick="setTab('ana')">分析</button>
  </div>

  <div id="rec">
    <div class="navbar">
      <button onclick="shiftWeek(-1)">◀</button>
      <span class="rng" id="rng"></span>
      <button onclick="shiftWeek(1)">▶</button>
    </div>
    <div class="days" id="days"></div>
    <div class="palette" id="palette"></div>
    <div class="toolbar">
      <div class="mode">
        <button id="mPaint" class="on" onclick="setMode('paint')">1コマ</button>
        <button id="mRange" onclick="setMode('range')">開始→終了</button>
        <button id="mMemo" onclick="setMode('memo')">メモ</button>
        <button id="mCopy" onclick="setMode('copy')">コピペ</button>
      </div>
      <div class="act">
        <button onclick="copyLog()">全文コピー</button>
        <button onclick="clearDay()">この日消去</button>
      </div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="grid" id="grid"></div>

    <details class="io">
      <summary>▸ バックアップ / Notesから復元 / 全文コピー</summary>
      <div class="hint" style="padding:8px 12px 0">「書き出す」は全期間の記録＋タグ設定をJSONファイルに保存。iPhoneでは共有シートから「"ファイル"に保存」でiCloud Driveに置ける。</div>
      <div class="iobtn"><button onclick="exportJSON()">バックアップを書き出す</button><button onclick="document.getElementById('bkFile').click()">読み込む</button><button onclick="copyLog()">全文コピー</button><button onclick="loadPaste()">下の内容を読込</button></div>
      <input type="file" id="bkFile" accept="application/json,.json" style="display:none" onchange="importJSON(this.files[0]);this.value='';">
      <textarea id="pasteArea" spellcheck="false" placeholder="Notesに退避したログをここに貼って「読込」"></textarea>
    </details>

    <details class="io" id="catBox" ontoggle="if(this.open)fillCatEdit()">
      <summary>▸ タグを編集 / 追加</summary>
      <div class="hint" style="padding:8px 12px 0">1行＝1タグ。書式：<b>名前 #色 キーワード,キーワード</b>。<br>色は省略可（自動）。上の行ほど分類が優先。キーワードが記録文に含まれると自動でそのタグに分類。<br><b>名前の頭に * を付けると「実働」に算入</b>（例：<b>*制作</b>）。</div>
      <div class="iobtn"><button onclick="saveCatEdit()">保存</button><button onclick="fillCatEdit()">現在を再表示</button><button onclick="resetCats()">初期化</button></div>
      <textarea id="catEdit" spellcheck="false" placeholder="睡眠 #505160 睡眠,昼寝"></textarea>
    </details>
  </div>

  <div id="ana" style="display:none">
    <div class="scope" id="scopeTabs">
      <button data-s="all" class="on" onclick="setScope('all')">1週間</button>
      <button data-s="wd" onclick="setScope('wd')">平日</button>
      <button data-s="we" onclick="setScope('we')">休日</button>
    </div>
    <div class="dayrow" id="dayrow"></div>
    <div id="anaOut"></div>
  </div>

  <div class="prodbar" id="prodbar" onclick="openProdSheet()">
    <span class="pb-ic">⇒</span><span class="pb-t">今日の生産物</span><span class="pb-n" id="pbN">0</span><span class="pb-add">＋ 記録する</span>
  </div>

  <div class="sheetbk" id="sheetbk" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="sh-h"><span class="sh-time" id="shTime"></span><span class="sh-cat" id="shCat"></span><button class="sh-x" onclick="closeSheet()">✕</button></div>
    <input id="shNote" placeholder="何してた？" autocomplete="off">
    <div class="outwrap">
      <label>⇒ 生産したもの・成果</label>
      <input id="shOut" placeholder="書いた記事、解析結果、覚えたこと…" autocomplete="off">
    </div>
    <button class="sh-done" onclick="closeSheet()">保存して閉じる</button>
  </div>

  <div class="saved" id="saved">保存</div>

<script>
const DEFAULT_CATS=[
  {k:'睡眠',c:'#505160',rx:['睡眠','昼寝','仮眠']},
  {k:'実験',c:'#6fb98f',rx:['実験','液作り','片付け','パッチ'],work:true},
  {k:'研究',c:'#2c7873',rx:['論文','セミナー','応募','ワークショップ','解析','考察'],work:true},
  {k:'講義学習',c:'#66a5ad',rx:['講義','授業','講座','ゼミ','勉強'],work:true},
  {k:'英語',c:'#68829e',rx:['英語','toeic','english']},
  {k:'Python',c:'#598234',rx:['python','コード','コーディング']},
  {k:'note',c:'#aebd38',rx:['note','執筆','コラム']},
  {k:'neuroarts',c:'#c4dfe6',rx:['neuroart']},
  {k:'バイト',c:'#07575b',rx:['バイト'],work:true},
  {k:'食事',c:'#7aa874',rx:['夜ご飯','ご飯','お昼','昼食','朝食','食事','ランチ','夕食']},
  {k:'対人',c:'#9cbf68',rx:['会う','対話','電話','友達','家族','面談']},
  {k:'運動',c:'#4c9a6e',rx:['運動','ジム','ラン','筋トレ','走']},
  {k:'ダラダラ',c:'#b0695a',rx:['だらだら','ダラダラ','サーフィン','ネット','sns','スマホ','youtube','動画']},
  {k:'移動',c:'#4d7b84',rx:['通学','下校','電車','ドライブ','外出','移動','帰宅','通勤']},
  {k:'生活',c:'#7f96a3',rx:['風呂','準備','起床','休憩','掃除','買い物']},
  {k:'その他',c:'#5d6f77',rx:[]},
];
const NEWCOLORS=['#66a5ad','#6fb98f','#aebd38','#68829e','#2c7873','#598234','#c4dfe6','#7aa874','#9cbf68','#4c9a6e','#07575b','#7f96a3'];
// 旧デフォルト色 → 新配色（Canva #4/#5/#7 系）への一回きり移行。自分で変えた色はそのまま残る。
const COLOR_MIG={'#64748b':'#505160','#34d399':'#6fb98f','#14b8a6':'#2c7873','#22d3ee':'#66a5ad','#3b82f6':'#68829e','#6366f1':'#598234','#a855f7':'#aebd38','#ec4899':'#c4dfe6','#0ea5e9':'#07575b','#84cc16':'#7aa874','#f59e0b':'#9cbf68','#10b981':'#4c9a6e','#ef4444':'#b0695a','#78716c':'#4d7b84','#94a3b8':'#7f96a3','#6b7280':'#5d6f77'};
const LS_CATS='tt-cats-v1';
let CATS=[], CMAP={}, CSET=new Set(), ORDER=[];
function normalizeCats(list){
  const seen=new Set(),out=[];
  (list||[]).forEach(c=>{ if(!c||!c.k)return; const k=String(c.k).trim(); if(!k||seen.has(k))return; seen.add(k);
    let col=c.c||NEWCOLORS[out.length%NEWCOLORS.length];
    col=COLOR_MIG[String(col).toLowerCase()]||col;
    out.push({k,c:col,rx:(c.rx||[]).map(s=>String(s).trim().toLowerCase()).filter(Boolean),work:!!c.work});});
  if(!seen.has('その他'))out.push({k:'その他',c:'#5d6f77',rx:[]});
  return out;
}
function rebuildCats(){CMAP=Object.fromEntries(CATS.map(x=>[x.k,x.c]));CSET=new Set(CATS.map(x=>x.k));ORDER=CATS.map(x=>x.k);}
async function loadCats(){
  // タグ設定も記録本体と同じく二重保存 (idbGet/idbSet は persistence 節で定義)
  try{const r=localStorage.getItem(LS_CATS);if(r){CATS=normalizeCats(JSON.parse(r));rebuildCats();saveCats();return;}}catch(e){}
  try{const r=await idbGet(LS_CATS);if(r){CATS=normalizeCats(JSON.parse(r));rebuildCats();saveCats();return;}}catch(e){}
  CATS=normalizeCats(DEFAULT_CATS);rebuildCats();
}
function saveCats(){

function colOf(k){return CMAP[k]||'#5d6f77';}
/* 明るい背景での文字可読性: 淡い色は文字用に自動で濃くする */
function lumOf(hex){try{const h=String(hex).replace('#','');const n=h.length===3?h.split('').map(c=>c+c).join(''):h;return (.299*parseInt(n.slice(0,2),16)+.587*parseInt(n.slice(2,4),16)+.114*parseInt(n.slice(4,6),16))/255;}catch(e){return 0;}}
function shade(hex,f){const h=String(hex).replace('#','');const n=h.length===3?h.split('').map(c=>c+c).join(''):h;const v=i=>Math.round(parseInt(n.slice(i,i+2),16)*f).toString(16).padStart(2,'0');return '#'+v(0)+v(2)+v(4);}
function deep(col){return lumOf(col)>.55?shade(col,.55):col;}
function textOn(bg){return lumOf(bg)>.55?'#123a41':'#ffffff';}
function serializeCats(){return CATS.map(c=>`${c.work?'*':''}${c.k} ${c.c} ${c.rx.join(',')}`.trim()).join('\n');}
function parseCatsText(txt){
  const out=[];
  txt.split('\n').forEach(line=>{
    const t=line.trim();if(!t)return;
    const toks=t.split(/\s+/);
    let k=toks[0];let work=false;
    if(k.startsWith('*')){work=true;k=k.slice(1);}
    if(!k)return;
    let col,rest;
    if(toks[1]&&/^#[0-9a-fA-F]{3,8}$/.test(toks[1])){col=toks[1];rest=toks.slice(2).join(' ');}
    else{col=null;rest=toks.slice(1).join(' ');}
    const rx=rest.split(/[,、\s]+/).map(s=>s.trim()).filter(Boolean);
    out.push({k,c:col,rx,work});
  });
  return out;
}
const DOWJ=['日','月','火','水','木','金','土'];
const WD=['月','火','水','木','金'],WE=['土','日'];
const SLOTS=48;
let STATE={};            // `${iso}#${slot}` -> {cat,note,out}
function mondayOf(d){const x=new Date(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);x.setHours(0,0,0,0);return x;}
let weekStart=mondayOf(new Date());   // 今週(月曜始まり)
let curDay=0, mode='paint', armed=null;

let clip=null;           // {items:[{o,rec}], len, label}
let copyStart=null, lastPaste=null;   // lastPaste = {key: 貼る前の値 or null} (取り消し用)

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function slotTime(s){const h=Math.floor(s/2),m=(s%2)?'30':'00';return String(h).padStart(2,'0')+':'+m;}
function slotEnd(s){return s>=SLOTS-1?'24:00':slotTime(s+1);}
function weekDays(){const a=[];for(let i=0;i<7;i++){const dt=addDays(weekStart,i);a.push({dt,iso:iso(dt),md:(dt.getMonth()+1)+'/'+dt.getDate(),dow:DOWJ[dt.getDay()]});}return a;}
function classify(t){const s=t.toLowerCase();for(const c of CATS){for(const r of c.rx){if(s.includes(r))return c.k;}}return 'その他';}
function flash(){const s=document.getElementById('saved');s.classList.add('show');clearTimeout(flash._t);flash._t=setTimeout(()=>s.classList.remove('show'),700);}

/* ---------- persistence (localStorage + IndexedDB の二重保存) ----------
   iOS Safari はしばらく開かないと localStorage を消すことがあるため、
   消えにくい IndexedDB にも毎回同じものを書く。
   読み込みは localStorage があればそれ (常に最後に書いた状態)、
   消えていたら IndexedDB から自動復元。キーとデータ形式は旧版と互換。 */
const LS_KEY='tt-state-v1';
const DB_NAME='time-tracker', DB_STORE='kv';
function idbOpen(){
  return new Promise((res,rej)=>{
    const q=indexedDB.open(DB_NAME,1);
    q.onupgradeneeded=()=>q.result.createObjectStore(DB_STORE);
    q.onsuccess=()=>res(q.result);
    q.onerror=()=>rej(q.error);
  });
}
async function idbGet(k){
  try{
    const db=await idbOpen();
    return await new Promise((res,rej)=>{
      const r=db.transaction(DB_STORE).objectStore(DB_STORE).get(k);
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    });
  }catch(e){return null;}
}
async function idbSet(k,v){
  try{
    const db=await idbOpen();
    await new Promise((res,rej)=>{
      const t=db.transaction(DB_STORE,'readwrite');
      t.objectStore(DB_STORE).put(v,k);
      t.oncomplete=res;
      t.onerror=()=>rej(t.error);
    });
  }catch(e){}
}
function persist(){
  flash();
  const s=JSON.stringify(STATE);
  try{localStorage.setItem(LS_KEY,s);}
  catch(e){console.error('save failed',e);}
  idbSet(LS_KEY,s);
  updateProdbar();
}
async function loadState(){
  try{const r=localStorage.getItem(LS_KEY);if(r){STATE=JSON.parse(r)||{};idbSet(LS_KEY,r);return;}}catch(e){}
  try{const r=await idbGet(LS_KEY);if(r){STATE=JSON.parse(r)||{};try{localStorage.setItem(LS_KEY,r);}catch(e){}return;}}catch(e){}
  STATE={};
}

/* ---------- serialize / parse ---------- */
function serialize(){
  let out='';
  weekDays().forEach(d=>{
    out+=`━━━━━ ${d.md}(${d.dow}) ━━━━━\n`;
    for(let s=0;s<SLOTS;s++){
      const v=STATE[d.iso+'#'+s];
      out+=slotTime(s)+(v?(' '+v.cat+(v.note?' '+v.note:'')+(v.out?' ⇒ '+v.out:'')):'')+'\n';
    }
  });
  return out;
}
function parseInto(txt){
  const lines=txt.split('\n');
  const dateRe=/(\d{1,2})\/(\d{1,2})/;
  const timeRe=/^\s*(\d{1,2}):(\d{2})\s*(.*)$/;
  let curIso=null;
  const yr=weekStart.getFullYear();
  for(const ln of lines){
    const tm=ln.match(timeRe);
    if(!tm){const m=ln.match(dateRe);if(m){curIso=yr+'-'+String(+m[1]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0');}continue;}
    if(!curIso)continue;
    const h=+tm[1],mi=+tm[2];let text=tm[3].trim();
    const slot=h*2+(mi>=30?1:0);
    const key=curIso+'#'+slot;
    if(!text){delete STATE[key];continue;}
    let prod='';
    const pi=text.indexOf('⇒');
    if(pi>=0){prod=text.slice(pi+1).trim();text=text.slice(0,pi).trim();}
    const toks=text.split(/\s+/);
    let cat,note;
    if(CSET.has(toks[0])){cat=toks[0];note=toks.slice(1).join(' ');}
    else{cat=classify(text);note=text;}
    const rec={cat,note};
    if(prod)rec.out=prod;
    STATE[key]=rec;
  }
}

/* ---------- コピペ ---------- */
function slotAt(dayIso,s){ // s が 48 以上なら翌日以降に繰り越し
  const dt=addDays(new Date(dayIso+'T00:00:00'),Math.floor(s/SLOTS));
  return {iso:iso(dt),s:s%SLOTS};
}
function makeClip(d,a,b){ // a..b (b<a なら翌日へ跨ぐ) を内容だけ保存
  const len=b>=a?b-a+1:SLOTS-a+b+1;
  const items=[];
  for(let o=0;o<len;o++){
    const p=slotAt(d.iso,a+o);const v=STATE[p.iso+'#'+p.s];
    if(v&&(v.cat||v.note||v.out))items.push({o,rec:JSON.parse(JSON.stringify(v))});
  }
  const label=`${d.md} ${slotTime(a)}–${b>=a?'':'翌'}${slotEnd(b)}`;
  const src=new Set();for(let o=0;o<len;o++){const p=slotAt(d.iso,a+o);src.add(p.iso+'#'+p.s);}
  return {items,len,label,src};
}
function pasteClip(d,s){
  const prev={};
  clip.items.forEach(({o,rec})=>{
    const p=slotAt(d.iso,s+o);const key=p.iso+'#'+p.s;
    if(!(key in prev))prev[key]=STATE[key]?JSON.parse(JSON.stringify(STATE[key])):null;
    STATE[key]=JSON.parse(JSON.stringify(rec));
  });
  lastPaste=prev;
  const end=s+clip.len-1;
  toast(`貼付 ${d.md} ${slotTime(s)}–${end>=SLOTS?'翌':''}${slotEnd(end%SLOTS)}`);
}
function undoPaste(){
  if(!lastPaste)return;
  for(const k in lastPaste){if(lastPaste[k])STATE[k]=lastPaste[k];else delete STATE[k];}
  lastPaste=null;renderGrid();renderHint();persist();toast('貼り付けを取り消した');
}
function resetClip(){clip=null;copyStart=null;renderGrid();renderHint();}
function renderGrid(){
  const g=document.getElementById('grid');g.innerHTML='';
  const diso=weekDays()[curDay].iso;
  const now=new Date();
  const nowSlot=(diso===iso(now))?now.getHours()*2+(now.getMinutes()>=30?1:0):-1;
  for(let s=0;s<SLOTS;s++){
    const v=STATE[diso+'#'+s];
    const row=document.createElement('div');
    row.className='row'+(s%2===0?' hh':'')+(s===rangeStart||s===copyStart?' rsel':'')+(s===nowSlot?' now':'')+(mode==='copy'&&clip&&clip.src.has(diso+'#'+s)?' csrc':'');
    const col=(v&&v.cat)?colOf(v.cat):null;
    if(col)row.style.background=`linear-gradient(90deg,${col}30,${col}0a 70%)`;
    row.innerHTML=`<div class="t">${slotTime(s)}</div><div class="bar" style="background:${col||'transparent'}"></div>`+
      `<div class="cell">${col?`<span class="lab" style="color:${deep(col)}">${v.cat}</span>`:''}`+
      `${v&&v.note?`<span class="nt">${esc(v.note)}</span>`:''}`+
      `${v&&v.out?`<span class="out">⇒ ${esc(v.out)}</span>`:''}</div>`;
    row.onclick=()=>onSlot(s);
    g.appendChild(row);
  }
}
function paintOne(key,cat){
  const v=STATE[key];
  if(v&&v.cat===cat){ // 同じタグ再タップ → タグだけ外す（メモ・生産物は残す）
    const rest={};if(v.note)rest.note=v.note;if(v.out)rest.out=v.out;
    if(Object.keys(rest).length)STATE[key]=rest;else delete STATE[key];
  }else STATE[key]={...(v||{}),cat};
}
function fillRange(aIso,a,b,cat){ // 同一日の a..b を塗る（30分スロット単位＝時間計算は従来通り正確）
  for(let i=a;i<=b;i++){const key=aIso+'#'+i;STATE[key]={...(STATE[key]||{}),cat};}
}
function onSlot(s){
  try{
  const d=weekDays()[curDay];
  const key=d.iso+'#'+s;
  if(mode==='paint'){
    if(!armed){warnHint();return;}
    paintOne(key,armed);
    renderGrid();persist();
  }else if(mode==='range'){
    if(!armed){warnHint();return;}
    if(rangeStart===null){rangeStart=s;renderGrid();renderHint();return;}
    if(rangeStart===s){rangeStart=null;renderGrid();renderHint();return;}
    if(s>rangeStart){
      const a=rangeStart,b=s;
      fillRange(d.iso,a,b,armed);
      toast(`${armed} ${slotTime(a)}–${slotEnd(b)}（${(b-a+1)*0.5}h）`);
    }else{
      // 終了が開始より上 → 深夜跨ぎ：開始→24:00 ＋ 翌日0:00→終了
      const nIso=iso(addDays(d.dt,1));
      fillRange(d.iso,rangeStart,SLOTS-1,armed);
      fillRange(nIso,0,s,armed);
      toast(`${armed} ${slotTime(rangeStart)}–翌${slotEnd(s)}（${(SLOTS-rangeStart+s+1)*0.5}h）`);
    }
    rangeStart=null;
    renderGrid();renderHint();persist();
  }else if(mode==='copy'){
    if(clip){pasteClip(d,s);renderGrid();renderHint();persist();return;}
    if(copyStart===null){copyStart=s;renderGrid();renderHint();return;}
    const c=makeClip(d,copyStart,s);copyStart=null;
    if(!c.items.length){toast('その範囲は空っぽ');renderGrid();renderHint();return;}
    clip=c;toast('コピーした → 貼る位置をタップ');
    renderGrid();renderHint();
  }else{openSheet(s);}
  }catch(e){console.error(e);}
}

/* ---------- JSON backup (全期間の記録+タグ設定) ---------- */
async function exportJSON(){
  const payload=JSON.stringify({app:'time-tracker',version:1,exported:new Date().toISOString(),cats:CATS,state:STATE},null,1);
  const name='time-tracker_'+iso(new Date())+'.json';
  // iOS: 共有シート → 「"ファイル"に保存」で iCloud Drive / 端末に置ける
  try{
    const file=new File([payload],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'タイムマネジメント バックアップ'});
      toast('書き出した');return;
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  const url=URL.createObjectURL(new Blob([payload],{type:'application/json'}));
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('書き出した');
}
function importJSON(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=='object')throw 0;
      let n=0;
      if(d.state&&typeof d.state==='object'){
        for(const k in d.state){
          if(/^\d{4}-\d{2}-\d{2}#\d{1,2}$/.test(k)&&d.state[k]&&typeof d.state[k]==='object'){STATE[k]=d.state[k];n++;}
        }
      }
      if(Array.isArray(d.cats)&&d.cats.length){CATS=normalizeCats(d.cats);saveCats();rebuildCats();}
      persist();armed=null;renderRec();if(tab==='ana')renderAna();fillCatEdit();
      toast(n+'枠 読み込んだ');
    }catch(e){toast('読み込めなかった');}
  };
  r.readAsText(file);
}

function fillCatEdit(){document.getElementById('catEdit').value=serializeCats();}
function saveCatEdit(){
  const txt=document.getElementById('catEdit').value;
  const list=parseCatsText(txt);
  if(!list.length){toast('タグが空');return;}
  CATS=normalizeCats(list);saveCats();rebuildCats();
  armed=null;renderRec();if(tab==='ana')renderAna();toast('タグ保存');
}
function resetCats(){
  if(!confirm('タグを初期状態に戻す？（追加したタグは消える）'))return;
  CATS=normalizeCats(DEFAULT_CATS);saveCats();rebuildCats();
  armed=null;fillCatEdit();renderRec();if(tab==='ana')renderAna();toast('初期化した');
}

/* ---------- analysis ---------- */
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function buildDays(){
  return weekDays().map(d=>{
    const cats={},seq=[],entries=[];
    for(let s=0;s<SLOTS;s++){
      const v=STATE[d.iso+'#'+s];
      if(v&&v.cat){cats[v.cat]=(cats[v.cat]||0)+0.5;seq.push(v.cat);}
      else seq.push(null);
      // タグ無しでも生産物・メモだけの記録は分析に載せる
      if(v&&(v.cat||v.note||v.out))entries.push({time:slotTime(s),cat:v.cat||'',note:v.note||'',out:v.out||''});
    }
    return {md:d.md,dow:d.dow,cats,seq,entries};
  });
}
function longestRun(seq,cat){let b=0,c=0;for(const x of seq){c=(x===cat)?c+1:0;b=Math.max(b,c);}return b*0.5;}
function agg(ds){const cats={};let total=0;ds.forEach(d=>{for(const k in d.cats){cats[k]=(cats[k]||0)+d.cats[k];total+=d.cats[k];}});return {cats,total};}
function donut(items,total){
  const cx=78,cy=78,R=58,W=30,C=2*Math.PI*R;let off=0,seg='';const t=total||1;
  items.forEach(d=>{const len=d.v/t*C;seg+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${d.c}" stroke-width="${W}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;});
  return `<svg width="156" height="156" viewBox="0 0 156 156">${seg}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="22" fill="#123a41" font-weight="700" font-family="ui-monospace,monospace">${total.toFixed(total%1?1:0)}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="#57828b">h 記録</text></svg>`;
}
function cards(cats,n,ds){
  const g=k=>cats[k]||0;
  const workKeys=CATS.filter(c=>c.work).map(c=>c.k);
  const work=workKeys.reduce((a,k)=>a+g(k),0);
  const skill=g('英語')+g('Python')+g('note')+g('neuroarts')+g('運動');
  const sleep=n>1?(g('睡眠')/n).toFixed(1)+'h':g('睡眠')+'h';
  const maxE=Math.max(0,...ds.map(d=>longestRun(d.seq,'実験')));
  const nOut=ds.reduce((a,d)=>a+d.entries.filter(e=>e.out).length,0);
  const A=[['実働',work+'h',0],['生産物',nOut+'個',nOut===0],[n>1?'睡眠/日':'睡眠',sleep,0],['スキル制作',skill+'h',skill===0],['ダラダラ',g('ダラダラ')+'h',1],['実験 最長連続',maxE+'h',0]];
  return '<div class="cards">'+A.map(([l,v,w])=>`<div class="card"><div class="cv" style="color:${w?'var(--warn)':'var(--txt)'}">${v}</div><div class="cl">${l}</div></div>`).join('')+'</div>';
}
function setScope(s){scope=s;renderAna();}
function renderDayRow(days){
  const el=document.getElementById('dayrow');el.innerHTML='';
  days.forEach((d,i)=>{const b=document.createElement('button');b.dataset.d=i;b.innerHTML=`${d.dow}<b>${d.md.split('/')[1]}</b>`;b.onclick=()=>setScope(i);el.appendChild(b);});
}
function renderAna(){
  const days=buildDays();
  renderDayRow(days);
  document.querySelectorAll('#scopeTabs button').forEach(b=>b.classList.toggle('on',typeof scope==='string'&&b.dataset.s===scope));
  document.querySelectorAll('#dayrow button').forEach(b=>b.classList.toggle('on',scope===+b.dataset.d));
  let sel,label;
  if(scope==='all'){sel=days;label='1週間';}
  else if(scope==='wd'){sel=days.filter(d=>WD.includes(d.dow));label='平日';}
  else if(scope==='we'){sel=days.filter(d=>WE.includes(d.dow));label='休日';}
  else{sel=days[scope]?[days[scope]]:[];label=days[scope]?`${days[scope].md}(${days[scope].dow})`:'';}
  const {cats,total}=agg(sel);
  const keysUnion=[...ORDER.filter(k=>cats[k]),...Object.keys(cats).filter(k=>!ORDER.includes(k))];
  const items=keysUnion.map(k=>({k,v:cats[k]||0,c:colOf(k)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  let html=`<div class="piewrap">${donut(items,total)}<div class="legend">`+
    (items.length?items.map(d=>`<div class="lrow"><i style="background:${d.c}"></i><span class="n">${d.k}</span><span class="v">${d.v}h ${(d.v/total*100).toFixed(0)}%</span></div>`).join(''):'<span class="v">記録なし</span>')+`</div></div>`;
  html+=`<h2>${label}・指標${sel.length>1?'（'+sel.length+'日）':''}</h2>`+cards(cats,sel.length,sel);
  if(sel.length>1){
    html+='<h2>日別の構成</h2>';
    sel.forEach(d=>{const tot=Object.values(d.cats).reduce((a,b)=>a+b,0);const wk=CATS.filter(c=>c.work).reduce((a,c)=>a+(d.cats[c.k]||0),0);
      html+=`<div class="day"><div class="dh"><span>${d.md}(${d.dow})</span><span>実働${wk}h · 記録${tot}h</span></div><div class="stack">`;
      [...ORDER,...Object.keys(d.cats).filter(k=>!ORDER.includes(k))].forEach(k=>{const h=d.cats[k];if(h)html+=`<div class="seg" style="width:${h/24*100}%;background:${colOf(k)}"></div>`;});
      html+='</div></div>';});
    const prods=[];
    sel.forEach(d=>d.entries.forEach(e=>{if(e.out)prods.push({md:d.md,cat:e.cat,out:e.out});}));
    if(prods.length){
      html+='<h2><span class="h2b"></span>生産したもの</h2>';
      prods.forEach(p=>{html+=`<div class="prodcard"><span class="pm">${p.md}</span><span class="po">${esc(p.out)}</span></div>`;});
    }
  }else if(sel.length===1){
    html+='<h2>この日の詳細</h2><div class="det">';
    sel[0].entries.forEach(e=>{html+=`<div class="drow"><span class="dt">${e.time}</span><span class="db" style="background:${colOf(e.cat)}"></span><span class="dc"><span class="dcat" style="color:${deep(colOf(e.cat))}">${e.cat}</span>${e.note?`<span class="dtxt">${esc(e.note)}</span>`:''}${e.out?`<span class="dout">⇒ ${esc(e.out)}</span>`:''}</span></div>`;});
    html+='</div><div class="note">詳細は「記録」タブでメモモードにして各枠に追記→ここに反映。</div>';
  }
  document.getElementById('anaOut').innerHTML=html;
}

function setTab(t){tab=t;closeSheetSilent();
  document.getElementById('tabRec').className=t==='rec'?'on':'';
  document.getElementById('tabAna').className=t==='ana'?'on':'';
  document.getElementById('rec').style.display=t==='rec'?'':'none';
  document.getElementById('ana').style.display=t==='ana'?'':'none';
  document.getElementById('prodbar').style.display=t==='rec'?'':'none';
  if(t==='ana')renderAna();
}

/* ---------- init ---------- */
async function init(){
  await loadCats();
  await loadState();
  renderRec();
  fillCatEdit();
  // ブラウザにデータ保護を頼む (ホーム画面アプリで特に効く)
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  // オフラインでも開けるように service worker を登録
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
}
init();
</script>
